# Example Kubernetes deployment for markitdown-mcp.
#
# Prerequisites:
#   1. Build or download the image:
#        # From a GitHub release attachment:
#        gunzip -c markitdown-mcp-image-linux-amd64.tar.gz | docker load
#        # Or build from source:
#        docker build -t markitdown-mcp:2.1.0 -f deploy/Dockerfile .
#   2. Push it to your registry and update the image reference below:
#        docker tag markitdown-mcp:2.1.0 registry.example.com/markitdown-mcp:2.1.0
#        docker push registry.example.com/markitdown-mcp:2.1.0
#   3. Create the auth-key secret:
#        kubectl create secret generic markitdown-mcp-auth \
#          --from-literal=auth-key='<your-key>'
#
# The server is stateless: replicas can be scaled freely and requests may hit
# any pod. Each pod exposes MCP at /mcp and a health endpoint at /health.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: markitdown-mcp
  labels:
    app: markitdown-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: markitdown-mcp
  template:
    metadata:
      labels:
        app: markitdown-mcp
    spec:
      containers:
        - name: markitdown-mcp
          image: registry.example.com/markitdown-mcp:2.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8000"
            - name: MCP_LOG_LEVEL
              value: "info"
            - name: MCP_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: markitdown-mcp-auth
                  key: auth-key
            # Optional: extra directories the server may read from, in addition
            # to its working directory and /tmp. Mount the volume and list it
            # here, e.g. "/data/docs" (path-separator separated for multiple).
            # - name: MARKITDOWN_SAFE_DIRS
            #   value: "/data/docs"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          # Example: make documents readable by the server through a volume.
          # volumes:
          #   - name: docs
          #     persistentVolumeClaim:
          #       claimName: docs-pvc
          # volumeMounts:
          #   - name: docs
          #     mountPath: /data/docs
          #     readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: markitdown-mcp
spec:
  selector:
    app: markitdown-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
