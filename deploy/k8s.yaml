# Example Kubernetes deployment for markitdown-mcp.
#
# Prerequisites:
#   1. Build or download the image:
#        # From a GitHub release attachment:
#        gunzip -c markitdown-mcp-image-linux-amd64.tar.gz | docker load
#        # Or build from source:
#        docker build -t markitdown-mcp:2.1.0 -f deploy/Dockerfile .
#   2. Push it to your registry and update the image reference below:
#        docker tag markitdown-mcp:2.1.0 registry.example.com/markitdown-mcp:2.1.0
#        docker push registry.example.com/markitdown-mcp:2.1.0
#   3. Create the auth-key secret:
#        kubectl create secret generic markitdown-mcp-auth \
#          --from-literal=auth-key='<your-key>'
#
# The server is stateless: replicas can be scaled freely and requests may hit
# any pod. Each pod exposes MCP at /mcp and a health endpoint at /health.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: markitdown-mcp
  labels:
    app: markitdown-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: markitdown-mcp
  template:
    metadata:
      labels:
        app: markitdown-mcp
    spec:
      containers:
        - name: markitdown-mcp
          image: registry.example.com/markitdown-mcp:2.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8000"
            - name: MCP_LOG_LEVEL
              value: "info"
            - name: MCP_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: markitdown-mcp-auth
                  key: auth-key
            # REQUIRED: S3 source for convert_file (the tool's only input).
            # Point at an S3-compatible store reachable from this pod (e.g. a
            # MinIO service in the same namespace). Env names mirror the
            # multica backend, so the secret can be shared with it. Without
            # these, every convert_file call fails with "not configured".
            # - name: S3_BUCKET
            #   value: "multica-uploads"
            # - name: AWS_ENDPOINT_URL
            #   value: "http://multica-minio.<namespace>.svc.cluster.local:9000"
            # - name: S3_REGION
            #   value: "us-east-1"
            # - name: AWS_ACCESS_KEY_ID
            #   valueFrom:
            #     secretKeyRef:
            #       name: multica-backend-secret
            #       key: AWS_ACCESS_KEY_ID
            # - name: AWS_SECRET_ACCESS_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: multica-backend-secret
            #       key: AWS_SECRET_ACCESS_KEY
            # Optional: restrict s3_key requests to workspace prefixes this
            # deployment may read (comma-separated, segment-aware matching).
            # - name: S3_KEY_PREFIXES
            #   value: "workspaces/11111111-1111-1111-1111-111111111111"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: markitdown-mcp
spec:
  selector:
    app: markitdown-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
