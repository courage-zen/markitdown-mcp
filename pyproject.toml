[project]
name = "markitdown-mcp"
version = "3.0.0"
description = "MCP server for converting documents to Markdown over Streamable HTTP"
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE",
]
requires-python = ">=3.10"
authors = [
    { name = "zhengyong" },
]
keywords = [
    "mcp",
    "markitdown",
    "markdown",
    "document-conversion",
    "model-context-protocol",
]
dependencies = [
    "mcp>=2.3.0",
    "markitdown[docx,pdf,pptx,xls,xlsx]>=0.1.9",
    "uvicorn>=0.31.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.28.0",
]

[project.scripts]
markitdown-mcp = "markitdown_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
    "moto>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["markitdown_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers -q"
markers = [
    "unit: Unit tests - fast, isolated tests",
    "security: Security tests - vulnerability and attack testing",
    "integration: Integration tests - component interaction tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
    "RET",
    "RUF",
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",
    "ARG001",
]

[tool.ruff.lint.isort]
known-first-party = [
    "markitdown_mcp",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
show_error_context = true

[[tool.mypy.overrides]]
module = [
    "markitdown.*",
    "mcp.*",
    "starlette.*",
    "dotenv.*",
    "uvicorn.*",
    "pydantic.*",
    "boto3.*",
    "botocore.*",
]
ignore_missing_imports = true
