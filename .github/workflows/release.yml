name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy markitdown_mcp/
      - name: Run tests
        run: uv run pytest -q

  image:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (linux/${{ matrix.arch }})
        run: |
          TAG="${GITHUB_REF_NAME}"
          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            --tag "markitdown-mcp:${TAG}" \
            --file deploy/Dockerfile \
            --load \
            .
      - name: Export image tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release
          docker save "markitdown-mcp:${TAG}" | gzip > "release/markitdown-mcp-image-linux-${{ matrix.arch }}.tar.gz"
          ls -lh release/
      - uses: actions/upload-artifact@v4
        with:
          name: release-image-linux-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  smoke:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - name: Start S3 backend (moto server)
        # convert_file's only input is an s3_key, so the round-trip needs a
        # real S3 endpoint. MinIO images are no longer anonymously pullable
        # (removed from Docker Hub; quay.io requires a login), so serve the
        # S3 API from moto — the same backend the test suite uses.
        # Bind 0.0.0.0 — the server container reaches the host through
        # host.docker.internal, not through loopback. No EXIT trap: each
        # step runs in its own shell, so a step-scoped trap would kill the
        # server before later steps run; the ephemeral runner handles cleanup.
        run: |
          python3 -m venv /tmp/s3env
          /tmp/s3env/bin/pip install --quiet "moto[server]" boto3
          /tmp/s3env/bin/moto_server -H 0.0.0.0 -p 9000 > /tmp/moto.log 2>&1 &
      - name: Download amd64 image artifact
        uses: actions/download-artifact@v4
        with:
          name: release-image-linux-amd64
          path: image
      - name: Load and start the server
        run: |
          TAG="${GITHUB_REF_NAME}"
          docker load < image/markitdown-mcp-image-linux-amd64.tar.gz
          docker run -d --rm \
            --name markitdown-mcp-smoke \
            --add-host=host.docker.internal:host-gateway \
            -e MCP_AUTH_KEY=smoke-key \
            -e S3_BUCKET=multica-uploads \
            -e AWS_ACCESS_KEY_ID=smoke-access \
            -e AWS_SECRET_ACCESS_KEY=smoke-secret \
            -e AWS_ENDPOINT_URL=http://host.docker.internal:9000 \
            -e S3_USE_PATH_STYLE=1 \
            -p 8123:8000 \
            "markitdown-mcp:${TAG}"

          # Wait for /health to come up
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/health)" = "200" ]; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8123/health | grep -q '"ok"'
      - name: Seed an object into the S3 backend
        run: |
          # moto server accepts any credentials; wait for it to answer.
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/ > /dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:9000/ > /dev/null \
            || { echo "moto server never became healthy"; cat /tmp/moto.log; exit 1; }

          /tmp/s3env/bin/python - <<'EOF'
          import boto3

          client = boto3.client(
              "s3",
              endpoint_url="http://127.0.0.1:9000",
              aws_access_key_id="smoke-access",
              aws_secret_access_key="smoke-secret",
              region_name="us-east-1",
          )
          client.create_bucket(Bucket="multica-uploads")
          client.put_object(
              Bucket="multica-uploads",
              Key="workspaces/ws-1/sample.txt",
              Body=b"smoke test content",
          )
          print("seeded workspaces/ws-1/sample.txt")
          EOF
      - name: Smoke-test the MCP surface
        run: |
          AUTH='Authorization: Bearer smoke-key'
          CT='Content-Type: application/json'
          ACCEPT='Accept: application/json, text/event-stream'
          INIT='{"jsonrpc":"2.0","method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}},"id":1}'

          # No token -> 401
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8123/mcp \
            -H "${CT}" -d "${INIT}")"
          [ "${code}" = "401" ] || { echo "expected 401 without token, got ${code}"; exit 1; }

          # Handshake works with the token
          curl -sf -X POST http://127.0.0.1:8123/mcp -H "${AUTH}" -H "${CT}" -H "${ACCEPT}" -d "${INIT}" \
            | grep -q 'markitdown-mcp'

          # Exactly the two expected tools; the removed inputs are gone from the schema
          tools="$(curl -sf -X POST http://127.0.0.1:8123/mcp -H "${AUTH}" -H "${CT}" -H "${ACCEPT}" \
            -d '{"jsonrpc":"2.0","method":"tools/list","id":2}')"
          echo "${tools}" | grep -q 'convert_file' || { echo 'convert_file missing'; exit 1; }
          echo "${tools}" | grep -q 'list_supported_formats' || { echo 'list_supported_formats missing'; exit 1; }
          echo "${tools}" | grep -q 'convert_directory' && { echo 'convert_directory should not exist'; exit 1; } || true
          echo "${tools}" | grep -q 'file_path' && { echo 'file_path must not appear in the schema'; exit 1; } || true
          echo "${tools}" | grep -q 'file_content' && { echo 'file_content must not appear in the schema'; exit 1; } || true

          # A real conversion round-trip via s3_key
          conv="$(curl -sf -X POST http://127.0.0.1:8123/mcp -H "${AUTH}" -H "${CT}" -H "${ACCEPT}" \
            -d '{"jsonrpc":"2.0","method":"tools/call","params":{"name":"convert_file","arguments":{"s3_key":"workspaces/ws-1/sample.txt","filename":"smoke.txt"}},"id":3}')"
          echo "${conv}" | grep -q 'smoke test content' \
            || { echo 's3_key conversion round-trip failed'; echo "${conv}"; exit 1; }

          # Legacy base64 input is rejected with s3_key guidance
          legacy="$(curl -sf -X POST http://127.0.0.1:8123/mcp -H "${AUTH}" -H "${CT}" -H "${ACCEPT}" \
            -d '{"jsonrpc":"2.0","method":"tools/call","params":{"name":"convert_file","arguments":{"file_content":"c21va2U=","filename":"x.txt"}},"id":4}')"
          echo "${legacy}" | grep -Eq '"isError"[^,]*true' \
            || { echo 'legacy file_content call should fail'; echo "${legacy}"; exit 1; }
          echo "${legacy}" | grep -q 's3_key' \
            || { echo 'legacy rejection should mention s3_key'; echo "${legacy}"; exit 1; }

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Check version matches tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${tag_version}" != "${pkg_version}" ]; then
            echo "Tag v${tag_version} does not match pyproject.toml version ${pkg_version}"
            exit 1
          fi
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [image, package, smoke]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Create checksum file
        working-directory: release-assets
        run: |
          rm -f checksums.txt
          find . -type f ! -name "checksums.txt" -print0 | sort -z | xargs -0 sha256sum > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate-release-notes: true
