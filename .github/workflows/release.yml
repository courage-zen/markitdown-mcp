name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy markitdown_mcp/
      - name: Run tests
        run: uv run pytest -q

  image:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (linux/${{ matrix.arch }})
        run: |
          TAG="${GITHUB_REF_NAME}"
          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            --tag "markitdown-mcp:${TAG}" \
            --file deploy/Dockerfile \
            --load \
            .
      - name: Export image tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release
          docker save "markitdown-mcp:${TAG}" | gzip > "release/markitdown-mcp-image-linux-${{ matrix.arch }}.tar.gz"
          ls -lh release/
      - name: Smoke-test image (amd64 only)
        if: matrix.arch == 'amd64'
        run: |
          TAG="${GITHUB_REF_NAME}"
          docker run -d --rm \
            --name markitdown-mcp-smoke \
            -e MCP_AUTH_KEY=smoke-key \
            -p 8123:8000 \
            "markitdown-mcp:${TAG}"
          trap 'docker stop markitdown-mcp-smoke || true' EXIT

          # Wait for /health to come up
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/health)" = "200" ]; then
              break
            fi
            sleep 1
          done

          # Health endpoint answers
          curl -sf http://127.0.0.1:8123/health | grep -q '"ok"'

          # No token -> 401
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8123/mcp \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}},"id":1}')"
          [ "${code}" = "401" ] || { echo "expected 401 without token, got ${code}"; exit 1; }

          AUTH='Authorization: Bearer smoke-key'
          CT='Content-Type: application/json'
          ACCEPT='Accept: application/json, text/event-stream'
          INIT='{"jsonrpc":"2.0","method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}},"id":1}'

          # Handshake works with the token
          curl -sf -X POST http://127.0.0.1:8123/mcp -H "${AUTH}" -H "${CT}" -H "${ACCEPT}" -d "${INIT}" \
            | grep -q 'markitdown-mcp'

          # Exactly the two expected tools
          tools="$(curl -sf -X POST http://127.0.0.1:8123/mcp -H "${AUTH}" -H "${CT}" -H "${ACCEPT}" \
            -d '{"jsonrpc":"2.0","method":"tools/list","id":2}')"
          echo "${tools}" | grep -q 'convert_file' || { echo 'convert_file missing'; exit 1; }
          echo "${tools}" | grep -q 'list_supported_formats' || { echo 'list_supported_formats missing'; exit 1; }
          echo "${tools}" | grep -q 'convert_directory' && { echo 'convert_directory should not exist'; exit 1; } || true

          # A real conversion round-trip (base64 content, no host path needed)
          B64="$(printf 'smoke test content' | base64)"
          curl -sf -X POST http://127.0.0.1:8123/mcp -H "${AUTH}" -H "${CT}" -H "${ACCEPT}" \
            -d "{\"jsonrpc\":\"2.0\",\"method\":\"tools/call\",\"params\":{\"name\":\"convert_file\",\"arguments\":{\"file_content\":\"${B64}\",\"filename\":\"smoke.txt\"}},\"id\":3}" \
            | grep -q 'smoke test content' || { echo 'convert_file round-trip failed'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: release-image-linux-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Check version matches tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${tag_version}" != "${pkg_version}" ]; then
            echo "Tag v${tag_version} does not match pyproject.toml version ${pkg_version}"
            exit 1
          fi
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [image, package]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Create checksum file
        working-directory: release-assets
        run: |
          rm -f checksums.txt
          find . -type f ! -name "checksums.txt" -print0 | sort -z | xargs -0 sha256sum > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate-release-notes: true
